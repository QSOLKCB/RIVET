name: R9 Historical Target Harnesses

on:
  push:
  pull_request:

jobs:
  frozen-r9-v1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify merged R1-R9-v1 surfaces remain unchanged
        run: |
          baseline=7d260e0671c5d089b25d6075ab1b66fb0886c99e
          authority_baseline=f7e340cf63b805885d3d977565ca234713277b11
          failed=0

          for authority in \
            RETRO-v2.md \
            machine/retro-v2.json \
            machine/project-v12.json; do
            if ! git diff --quiet \
                "$authority_baseline" HEAD -- "$authority"; then
              echo "Frozen R9-v2 authority changed: $authority" >&2
              failed=1
            fi
          done

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              .github/workflows/r9-amiga.yml|.github/workflows/r9-classic-mac.yml|.github/workflows/r9-target-harnesses.yml|.github/workflows/r9-windows9x.yml|AGENTS.md|README.md|RETRO-v2.md|ROADMAP.md|evidence/r9_amiga_os_identity.c|evidence/r9_classic_mac_os_identity.c|evidence/r9_guest_browser_proof.c|evidence/r9_win9x_browser_proof.c|evidence/retro/README.md|evidence/retro/physical-receipt.example.json|index.html|machine/project-v12.json|machine/retro-v2.json|scripts/r9_amiga_full_system.sh|scripts/r9_build_amiga_payload.sh|scripts/r9_build_classic_mac_payload.sh|scripts/r9_build_windows9x_payload.sh|scripts/r9_classic_mac_full_system.sh|scripts/r9_e3_receipt.py|scripts/r9_validate_dispatch_inputs.py|scripts/r9_validate_physical_receipt.py|scripts/r9_windows9x_full_system.sh|tests/r9_e3_e4_receipt_selftest.py|tests/r9_guest_proof_freshness_selftest.py|tests/r9_workflow_input_selftest.py)
                ;;
              *)
                echo "Frozen pre-R9-v2 surface changed outside allowlist: $path" >&2
                failed=1
                ;;
            esac
          done < <(
            git diff --name-only --no-renames "$baseline" HEAD
          )

          exit "$failed"

      - name: Validate machine JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("machine").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY

  receipt-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: E3 and E4 receipt self-test
        run: python3 tests/r9_e3_e4_receipt_selftest.py

      - name: Workflow input routing self-test
        run: python3 tests/r9_workflow_input_selftest.py

      - name: Guest proof freshness self-test
        run: python3 tests/r9_guest_proof_freshness_selftest.py

      - name: Python syntax
        run: |
          python3 -m py_compile             scripts/r9_e3_receipt.py             scripts/r9_validate_dispatch_inputs.py             scripts/r9_validate_physical_receipt.py

      - name: Harness syntax
        run: |
          bash -n scripts/r9_build_windows9x_payload.sh
          bash -n scripts/r9_windows9x_full_system.sh
          bash -n scripts/r9_build_classic_mac_payload.sh
          bash -n scripts/r9_classic_mac_full_system.sh
          bash -n scripts/r9_build_amiga_payload.sh
          bash -n scripts/r9_amiga_full_system.sh

  windows9x-payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Win32 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file mingw-w64
      - name: Build source-bound Windows 9x payload
        run: |
          bash scripts/r9_build_windows9x_payload.sh             "$(git rev-parse HEAD)"             build/r9-windows9x-payload

  classic-mac-payloads:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build source-bound Classic Mac 68k payload
        run: |
          bash scripts/r9_build_classic_mac_payload.sh             m68k "$(git rev-parse HEAD)" build/r9-mac-m68k-payload
      - name: Build source-bound Classic Mac PowerPC payload
        run: |
          bash scripts/r9_build_classic_mac_payload.sh             powerpc "$(git rev-parse HEAD)" build/r9-mac-ppc-payload

  amiga-payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build source-bound Amiga m68k payload
        run: |
          bash scripts/r9_build_amiga_payload.sh             "$(git rev-parse HEAD)"             build/r9-amiga-payload
