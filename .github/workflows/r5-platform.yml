name: R5 Platform Split

on:
  push:
  pull_request:

jobs:
  frozen-r4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen R4 baseline surfaces remain unchanged
        run: |
          baseline=e9dcaf87cb241fe59f0fa388c10ce93a78007a22
          failed=0

          while IFS= read -r path; do
            case "$path" in
              .gitattributes|\
              .github/workflows/r5-platform.yml|\
              AGENTS.md|\
              Makefile|\
              PLATFORM-v1.md|\
              README.md|\
              ROADMAP.md|\
              examples/r5_platform_proof.c|\
              fixtures/r5_empty.txt|\
              include/rivet/platform.h|\
              index.html|\
              machine/platform-v1.json|\
              machine/project-v7.json|\
              platform/platform.c|\
              platform/posix/platform_posix.c|\
              platform/win32/platform_win32.c|\
              scripts/r5_win32_build.ps1|\
              tests/test_platform.c)
                continue
                ;;
            esac

            if ! git diff --quiet "$baseline" -- "$path"; then
              echo "Frozen pre-R5 path changed: $path" >&2
              failed=1
            fi
          done < <(git ls-tree -r --name-only "$baseline")

          exit "$failed"

      - name: Validate machine JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("machine").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY

  posix-native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -std=c99 -O2 -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@v4

      - name: Platform contract tests
        run: |
          make clean
          make test-platform

      - name: Native POSIX proof
        run: |
          make clean
          make platform-posix
          output="$(./build/rivet-platform-posix fixtures/r4_textview.txt fixtures/r5_empty.txt)"
          echo "$output"
          bits="$(getconf LONG_BIT)"
          echo "$output" | grep -F "backend=posix-v1"
          echo "$output" | grep -F "os=POSIX"
          echo "$output" | grep -F "pointer_bits=$bits"
          echo "$output" | grep -F "bytes=237"
          echo "$output" | grep -F "empty=0"
          echo "$output" | grep -F "fnv1a64=36aaff7f4aaa99ab"
          echo "$output" | grep -F "monotonic=nondecreasing"

  posix-container:
    strategy:
      matrix:
        image: [gcc:13.5.0-bookworm, gcc:14.3.0-bookworm]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: E1 container toolchain proof
        run: |
          gcc --version
          make clean
          make test-platform CC=gcc CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Werror"
          make clean
          make platform-posix CC=gcc CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Werror"
          ./build/rivet-platform-posix fixtures/r4_textview.txt fixtures/r5_empty.txt

  win32-native:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Build native Win32 backend
        shell: pwsh
        run: ./scripts/r5_win32_build.ps1 -Arch ${{ matrix.arch }}

      - name: Execute contract tests
        shell: pwsh
        run: |
          & .\build\test-platform-win32.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute Win32 platform proof
        shell: pwsh
        run: |
          $output = & .\build\rivet-platform-win32.exe "fixtures\r4_textview.txt" "fixtures\r5_empty.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output
          if ($output -notmatch "backend=win32-v1") { throw "wrong backend identity" }
          if ($output -notmatch "os=Win32") { throw "wrong OS/API identity" }
          $expectedBits = if ("${{ matrix.arch }}" -eq "x86") { "32" } else { "64" }
          if ($output -notmatch "pointer_bits=$expectedBits") { throw "wrong pointer width" }
          if ($output -notmatch "bytes=237") { throw "wrong fixture byte count" }
          if ($output -notmatch "empty=0") { throw "zero-capacity empty-file proof failed" }
          if ($output -notmatch "fnv1a64=36aaff7f4aaa99ab") { throw "wrong fixture identity" }
          if ($output -notmatch "monotonic=nondecreasing") { throw "clock proof failed" }
